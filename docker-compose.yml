services:
  postgres:
    image: postgres:18
    container_name: ha_ai_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ha_ai}
      POSTGRES_USER: ${POSTGRES_USER:-ha_ai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ha_ai_dev_password}
      TZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./schema:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-ha_ai} -d ${POSTGRES_DB:-ha_ai}",
        ]
      interval: 10s
      timeout: 5s
      retries: 8

  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:2026.3.4
    container_name: ha_ai_homeassistant
    restart: unless-stopped
    profiles: ["dev-ha"]
    ports:
      - "8123:8123"
    volumes:
      - homeassistant_config:/config

  collector:
    build:
      context: .
      dockerfile: collector/Dockerfile
    container_name: ha_ai_collector
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ha_ai}:${POSTGRES_PASSWORD:-ha_ai_dev_password}@postgres:5432/${POSTGRES_DB:-ha_ai}
      HA_WS_URL: ws://homeassistant.local:8123/api/websocket
      HA_TOKEN: ${HA_TOKEN:-replace-me}
      EVENT_TYPES: state_changed,call_service
      DOMAIN_ALLOWLIST: ""
      DOMAIN_EXCLUDELIST: automation,updater
      BATCH_SIZE: 250
      FLUSH_INTERVAL_SECONDS: 2
      RECONNECT_INITIAL_SECONDS: 1
      RECONNECT_MAX_SECONDS: 30
      RECONNECT_JITTER_RATIO: 0.2
      MAX_BUFFERED_EVENTS: 5000
      OVERFLOW_POLICY: drop_newest
      RETRY_BACKPRESSURE_DELAY_MS: 250
      COLLECTOR_INSTANCE_ID: collector-local
      LOG_LEVEL: info
    command:
      [
        "/bin/sh",
        "-lc",
        "yarn workspace @ha-ai/tools start:retention --schedule & yarn workspace @ha-ai/tools start:automation-snapshots --schedule & yarn workspace @ha-ai/tools start:daily-home-summary --schedule & yarn workspace @ha-ai/collector start:collector",
      ]
    working_dir: /app
    volumes:
      - ./:/app

  analytics:
    build:
      context: .
      dockerfile: collector/Dockerfile
    container_name: ha_ai_analytics
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["analytics"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ha_ai}:${POSTGRES_PASSWORD:-ha_ai_dev_password}@postgres:5432/${POSTGRES_DB:-ha_ai}
      REPORT_OUTPUT_DIR: /app/reports
      ANALYTICS_TIMEZONE: UTC
      LOG_LEVEL: info
    command: ["yarn", "workspace", "@ha-ai/tools", "start:analytics"]
    working_dir: /app
    volumes:
      - ./:/app
      - ./reports:/app/reports

  ui:
    build:
      context: .
      dockerfile: collector/Dockerfile
    container_name: ha_ai_ui
    restart: unless-stopped
    profiles: ["ui"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ha_ai}:${POSTGRES_PASSWORD:-ha_ai_dev_password}@postgres:5432/${POSTGRES_DB:-ha_ai}
      UI_HOST: 0.0.0.0
      UI_PORT: ${UI_PORT:-5080}
      UI_PORT_BIND: ${UI_PORT_BIND:-5080}
      HA_WS_URL: ${HA_WS_URL:-ws://homeassistant.local:8123/api/websocket}
      HA_HTTP_URL: ${HA_HTTP_URL:-}
      HA_TOKEN: ${HA_TOKEN:-replace-me}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      UI_BASIC_AUTH_USERNAME: ${UI_BASIC_AUTH_USERNAME:-operator}
      UI_BASIC_AUTH_PASSWORD: ${UI_BASIC_AUTH_PASSWORD:-operator}
      UI_ACTION_STATUS_TTL_SECONDS: ${UI_ACTION_STATUS_TTL_SECONDS:-900}
      UI_DEFAULT_POLL_INTERVAL_MS: ${UI_DEFAULT_POLL_INTERVAL_MS:-10000}
      UI_BUILD_VERSION: local-dev
      UI_WORKSPACE_ROOT: /app
      UI_YARN_BIN: yarn
    command: ["yarn", "workspace", "@ha-ai/ui", "start:ui"]
    working_dir: /app
    ports:
      - "${UI_PORT_BIND:-5080}:${UI_PORT:-5080}"

  pgadmin:
    image: dpage/pgadmin4:9
    container_name: ha_ai_pgadmin
    restart: unless-stopped
    profiles: ["debug"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: ${PGADMIN_MASTER_PASSWORD_REQUIRED:-False}
      PGADMIN_REPLACE_SERVERS_ON_STARTUP: "True"
      PGADMIN_DB_HOST: ${PGADMIN_DB_HOST:-postgres}
      PGADMIN_DB_PORT: ${PGADMIN_DB_PORT:-5432}
      PGADMIN_DB_NAME: ${PGADMIN_DB_NAME:-${POSTGRES_DB:-ha_ai}}
      PGADMIN_DB_USER: ${PGADMIN_DB_USER:-${POSTGRES_USER:-ha_ai}}
      PGADMIN_DB_PASSWORD: ${PGADMIN_DB_PASSWORD:-${POSTGRES_PASSWORD:-ha_ai_dev_password}}
    entrypoint:
      - /bin/sh
      - /pgadmin4/bootstrap.sh
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
      - ./pgadmin/bootstrap.sh:/pgadmin4/bootstrap.sh:ro

volumes:
  postgres_data:
  pgadmin_data:
  homeassistant_config:
