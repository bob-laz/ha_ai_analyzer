x-app-image: &app_image ${IMAGE_REPO:-ghcr.io/bob-laz/ha_ai_analyzer}:${IMAGE_TAG:-main-latest}

services:
  postgres:
    image: postgres:18
    container_name: ha_ai_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ha_ai}
      POSTGRES_USER: ${POSTGRES_USER:-ha_ai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ha_ai_dev_password}
      TZ: UTC
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./schema:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-ha_ai} -d ${POSTGRES_DB:-ha_ai}",
        ]
      interval: 10s
      timeout: 5s
      retries: 8

  collector:
    image: *app_image
    container_name: ha_ai_collector
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    command: ["yarn", "workspace", "@ha-ai/collector", "start:collector"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ha_ai}:${POSTGRES_PASSWORD:-ha_ai_dev_password}@postgres:5432/${POSTGRES_DB:-ha_ai}
      HA_WS_URL: ${HA_WS_URL:?HA_WS_URL is required}
      HA_TOKEN: ${HA_TOKEN:?HA_TOKEN is required}
      EVENT_TYPES: ${EVENT_TYPES:-state_changed,call_service}
      DOMAIN_ALLOWLIST: ${DOMAIN_ALLOWLIST:-}
      DOMAIN_EXCLUDELIST: ${DOMAIN_EXCLUDELIST:-automation,updater}
      BATCH_SIZE: ${BATCH_SIZE:-250}
      FLUSH_INTERVAL_SECONDS: ${FLUSH_INTERVAL_SECONDS:-2}
      RECONNECT_INITIAL_SECONDS: ${RECONNECT_INITIAL_SECONDS:-1}
      RECONNECT_MAX_SECONDS: ${RECONNECT_MAX_SECONDS:-30}
      RECONNECT_JITTER_RATIO: ${RECONNECT_JITTER_RATIO:-0.2}
      MAX_BUFFERED_EVENTS: ${MAX_BUFFERED_EVENTS:-5000}
      OVERFLOW_POLICY: ${OVERFLOW_POLICY:-drop_newest}
      RETRY_BACKPRESSURE_DELAY_MS: ${RETRY_BACKPRESSURE_DELAY_MS:-250}
      COLLECTOR_INSTANCE_ID: ${COLLECTOR_INSTANCE_ID:-collector-proxmox}
      LOG_LEVEL: ${LOG_LEVEL:-info}

  retention:
    image: *app_image
    container_name: ha_ai_retention
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    command: ["yarn", "workspace", "@ha-ai/tools", "start:retention", "--schedule"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ha_ai}:${POSTGRES_PASSWORD:-ha_ai_dev_password}@postgres:5432/${POSTGRES_DB:-ha_ai}
      ANALYTICS_TIMEZONE: ${ANALYTICS_TIMEZONE:-UTC}
      RETENTION_SCHEDULE_TIME: ${RETENTION_SCHEDULE_TIME:-03:30}
      RETENTION_SCHEDULE_TIMEZONE: ${RETENTION_SCHEDULE_TIMEZONE:-UTC}
      EVENTS_RETENTION_DAYS: ${EVENTS_RETENTION_DAYS:-14}
      EVENTS_PARTITION_LOOKBACK_DAYS: ${EVENTS_PARTITION_LOOKBACK_DAYS:-2}
      EVENTS_PARTITION_PRECREATE_DAYS: ${EVENTS_PARTITION_PRECREATE_DAYS:-14}
      TRACE_CONTEXTS_RETENTION_DAYS: ${TRACE_CONTEXTS_RETENTION_DAYS:-30}
      ENTITY_SNAPSHOTS_RETENTION_DAYS: ${ENTITY_SNAPSHOTS_RETENTION_DAYS:-30}
      AUTOMATION_SNAPSHOTS_RETENTION_DAYS: ${AUTOMATION_SNAPSHOTS_RETENTION_DAYS:-60}
      HA_ENVIRONMENT_SNAPSHOTS_RETENTION_DAYS: ${HA_ENVIRONMENT_SNAPSHOTS_RETENTION_DAYS:-60}
      HA_USAGE_SNAPSHOTS_RETENTION_DAYS: ${HA_USAGE_SNAPSHOTS_RETENTION_DAYS:-180}
      AGENT_RUNS_RETENTION_DAYS: ${AGENT_RUNS_RETENTION_DAYS:-180}
      ORPHAN_ANALYSIS_RESULTS_RETENTION_DAYS: ${ORPHAN_ANALYSIS_RESULTS_RETENTION_DAYS:-180}
      RETENTION_BATCH_SIZE: ${RETENTION_BATCH_SIZE:-50000}
      LOG_LEVEL: ${LOG_LEVEL:-info}

  automation-snapshots:
    image: *app_image
    container_name: ha_ai_automation_snapshots
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    command: ["yarn", "workspace", "@ha-ai/tools", "start:automation-snapshots", "--schedule"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ha_ai}:${POSTGRES_PASSWORD:-ha_ai_dev_password}@postgres:5432/${POSTGRES_DB:-ha_ai}
      HA_WS_URL: ${HA_WS_URL:?HA_WS_URL is required}
      HA_HTTP_URL: ${HA_HTTP_URL:-}
      HA_TOKEN: ${HA_TOKEN:?HA_TOKEN is required}
      ANALYTICS_TIMEZONE: ${ANALYTICS_TIMEZONE:-UTC}
      AUTOMATION_SNAPSHOT_SCHEDULE_TIME: ${AUTOMATION_SNAPSHOT_SCHEDULE_TIME:-03:15}
      AUTOMATION_SNAPSHOT_SCHEDULE_TIMEZONE: ${AUTOMATION_SNAPSHOT_SCHEDULE_TIMEZONE:-UTC}
      AUTOMATION_SNAPSHOT_INCLUDE_CONFIG: ${AUTOMATION_SNAPSHOT_INCLUDE_CONFIG:-true}
      AUTOMATION_SNAPSHOT_REQUEST_TIMEOUT_MS: ${AUTOMATION_SNAPSHOT_REQUEST_TIMEOUT_MS:-10000}
      AUTOMATION_SNAPSHOT_WS_REQUEST_TIMEOUT_MS: ${AUTOMATION_SNAPSHOT_WS_REQUEST_TIMEOUT_MS:-10000}
      AUTOMATION_SNAPSHOT_CONFIG_FETCH_CONCURRENCY: ${AUTOMATION_SNAPSHOT_CONFIG_FETCH_CONCURRENCY:-5}
      AUTOMATION_SNAPSHOT_INCLUDE_ENVIRONMENT_INVENTORY: ${AUTOMATION_SNAPSHOT_INCLUDE_ENVIRONMENT_INVENTORY:-true}
      AUTOMATION_SNAPSHOT_INCLUDE_USAGE_SNAPSHOTS: ${AUTOMATION_SNAPSHOT_INCLUDE_USAGE_SNAPSHOTS:-true}
      LOG_LEVEL: ${LOG_LEVEL:-info}

  analytics:
    image: *app_image
    container_name: ha_ai_analytics
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    command: ["yarn", "workspace", "@ha-ai/tools", "start:analytics", "--schedule"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ha_ai}:${POSTGRES_PASSWORD:-ha_ai_dev_password}@postgres:5432/${POSTGRES_DB:-ha_ai}
      REPORT_OUTPUT_DIR: ${REPORT_OUTPUT_DIR:-/app/reports}
      ANALYTICS_TIMEZONE: ${ANALYTICS_TIMEZONE:-UTC}
      HA_WS_URL: ${HA_WS_URL:?HA_WS_URL is required}
      HA_HTTP_URL: ${HA_HTTP_URL:-}
      HA_TOKEN: ${HA_TOKEN:?HA_TOKEN is required}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY is required}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      LLM_MODEL: ${LLM_MODEL:-gpt-4.1-mini}
      LLM_ANALYSIS_MAX_INSIGHTS: ${LLM_ANALYSIS_MAX_INSIGHTS:-5}
      LLM_ANALYSIS_WINDOW_HOURS: ${LLM_ANALYSIS_WINDOW_HOURS:-24}
      LLM_SCHEDULE_TIME: ${LLM_SCHEDULE_TIME:-03:00}
      LLM_SCHEDULE_TIMEZONE: ${LLM_SCHEDULE_TIMEZONE:-UTC}
      LLM_MAX_TOP_CHANGES: ${LLM_MAX_TOP_CHANGES:-20}
      LLM_MAX_TRACE_CONTEXTS: ${LLM_MAX_TRACE_CONTEXTS:-10}
      LLM_MAX_EVENTS_PER_CONTEXT: ${LLM_MAX_EVENTS_PER_CONTEXT:-60}
      LLM_TRACE_MAX_DEPTH: ${LLM_TRACE_MAX_DEPTH:-6}
      LLM_MAX_ENVIRONMENT_ITEMS_PER_TYPE: ${LLM_MAX_ENVIRONMENT_ITEMS_PER_TYPE:-50}
      LLM_MAX_RESOURCE_USAGE_ITEMS_PER_TYPE: ${LLM_MAX_RESOURCE_USAGE_ITEMS_PER_TYPE:-20}
      LLM_HA_NOTIFICATION_ENABLED: ${LLM_HA_NOTIFICATION_ENABLED:-true}
      LLM_HA_NOTIFICATION_TITLE: ${LLM_HA_NOTIFICATION_TITLE:-Home Assistant AI Analysis}
      LLM_HA_NOTIFICATION_ID: ${LLM_HA_NOTIFICATION_ID:-ha_ai_llm_analysis_latest}
      LLM_HA_NOTIFICATION_MAX_CHARS: ${LLM_HA_NOTIFICATION_MAX_CHARS:-6000}
      LLM_HA_NOTIFICATION_REQUEST_TIMEOUT_MS: ${LLM_HA_NOTIFICATION_REQUEST_TIMEOUT_MS:-10000}
      LLM_REQUEST_TIMEOUT_MS: ${LLM_REQUEST_TIMEOUT_MS:-30000}
      LLM_RETRY_MAX_ATTEMPTS: ${LLM_RETRY_MAX_ATTEMPTS:-3}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - analysis_reports:/app/reports

  daily-home-summary:
    image: *app_image
    container_name: ha_ai_daily_home_summary
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    command: ["yarn", "workspace", "@ha-ai/tools", "start:daily-home-summary", "--schedule"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ha_ai}:${POSTGRES_PASSWORD:-ha_ai_dev_password}@postgres:5432/${POSTGRES_DB:-ha_ai}
      ANALYTICS_TIMEZONE: ${ANALYTICS_TIMEZONE:-UTC}
      HA_WS_URL: ${HA_WS_URL:?HA_WS_URL is required}
      HA_HTTP_URL: ${HA_HTTP_URL:-}
      HA_TOKEN: ${HA_TOKEN:?HA_TOKEN is required}
      DAILY_SUMMARY_SCHEDULE_TIME: ${DAILY_SUMMARY_SCHEDULE_TIME:-00:10}
      DAILY_SUMMARY_SCHEDULE_TIMEZONE: ${DAILY_SUMMARY_SCHEDULE_TIMEZONE:-UTC}
      DAILY_SUMMARY_TARGET_DAY_OFFSET: ${DAILY_SUMMARY_TARGET_DAY_OFFSET:-1}
      DAILY_SUMMARY_BASELINE_DAYS: ${DAILY_SUMMARY_BASELINE_DAYS:-7}
      DAILY_SUMMARY_MIN_BASELINE_DAYS: ${DAILY_SUMMARY_MIN_BASELINE_DAYS:-3}
      DAILY_SUMMARY_ANOMALY_ZSCORE_THRESHOLD: ${DAILY_SUMMARY_ANOMALY_ZSCORE_THRESHOLD:-2}
      DAILY_SUMMARY_ANOMALY_MIN_DELTA: ${DAILY_SUMMARY_ANOMALY_MIN_DELTA:-25}
      DAILY_SUMMARY_TOP_CHANGES_LIMIT: ${DAILY_SUMMARY_TOP_CHANGES_LIMIT:-8}
      DAILY_SUMMARY_TOP_SUBJECTS_LIMIT: ${DAILY_SUMMARY_TOP_SUBJECTS_LIMIT:-5}
      DAILY_SUMMARY_MAX_RESOURCE_USAGE_ITEMS_PER_TYPE: ${DAILY_SUMMARY_MAX_RESOURCE_USAGE_ITEMS_PER_TYPE:-5}
      DAILY_SUMMARY_NOTIFICATION_ENABLED: ${DAILY_SUMMARY_NOTIFICATION_ENABLED:-true}
      DAILY_SUMMARY_NOTIFICATION_TITLE: ${DAILY_SUMMARY_NOTIFICATION_TITLE:-Daily Home Summary}
      DAILY_SUMMARY_NOTIFICATION_ID: ${DAILY_SUMMARY_NOTIFICATION_ID:-ha_ai_daily_summary_latest}
      DAILY_SUMMARY_NOTIFICATION_MAX_CHARS: ${DAILY_SUMMARY_NOTIFICATION_MAX_CHARS:-6000}
      DAILY_SUMMARY_NOTIFICATION_REQUEST_TIMEOUT_MS: ${DAILY_SUMMARY_NOTIFICATION_REQUEST_TIMEOUT_MS:-10000}
      LOG_LEVEL: ${LOG_LEVEL:-info}

  ui:
    image: *app_image
    container_name: ha_ai_ui
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    command: ["yarn", "workspace", "@ha-ai/ui", "start:ui"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ha_ai}:${POSTGRES_PASSWORD:-ha_ai_dev_password}@postgres:5432/${POSTGRES_DB:-ha_ai}
      UI_HOST: 0.0.0.0
      UI_PORT: ${UI_PORT:-5080}
      HA_WS_URL: ${HA_WS_URL:?HA_WS_URL is required}
      HA_HTTP_URL: ${HA_HTTP_URL:-}
      HA_TOKEN: ${HA_TOKEN:?HA_TOKEN is required}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      UI_BASIC_AUTH_USERNAME: ${UI_BASIC_AUTH_USERNAME:?UI_BASIC_AUTH_USERNAME is required}
      UI_BASIC_AUTH_PASSWORD: ${UI_BASIC_AUTH_PASSWORD:?UI_BASIC_AUTH_PASSWORD is required}
      UI_ACTION_STATUS_TTL_SECONDS: ${UI_ACTION_STATUS_TTL_SECONDS:-900}
      UI_DEFAULT_POLL_INTERVAL_MS: ${UI_DEFAULT_POLL_INTERVAL_MS:-10000}
      UI_BUILD_VERSION: ${IMAGE_TAG:-main-latest}
      UI_WORKSPACE_ROOT: /app
      UI_YARN_BIN: yarn
    ports:
      - "${UI_PORT_BIND:-5080}:${UI_PORT:-5080}"

  pgadmin:
    image: dpage/pgadmin4:2026-06-16-1
    container_name: ha_ai_pgadmin
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-change-me}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: ${PGADMIN_MASTER_PASSWORD_REQUIRED:-False}
      PGADMIN_REPLACE_SERVERS_ON_STARTUP: "True"
      PGADMIN_DB_HOST: ${PGADMIN_DB_HOST:-postgres}
      PGADMIN_DB_PORT: ${PGADMIN_DB_PORT:-5432}
      PGADMIN_DB_NAME: ${PGADMIN_DB_NAME:-${POSTGRES_DB:-ha_ai}}
      PGADMIN_DB_USER: ${PGADMIN_DB_USER:-${POSTGRES_USER:-ha_ai}}
      PGADMIN_DB_PASSWORD: ${PGADMIN_DB_PASSWORD:-${POSTGRES_PASSWORD:-ha_ai_dev_password}}
    entrypoint:
      - /bin/sh
      - /pgadmin4/bootstrap.sh
    ports:
      - "${PGADMIN_PORT_BIND:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
      - ./pgadmin/bootstrap.sh:/pgadmin4/bootstrap.sh:ro

volumes:
  postgres_data:
  pgadmin_data:
  analysis_reports:
