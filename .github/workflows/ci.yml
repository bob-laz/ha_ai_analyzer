name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Verify Docker image build
        run: docker build -f collector/Dockerfile . --tag ha-ai-analyzer:ci-${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Enable Corepack
        run: |
          corepack enable
          corepack install

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run verify
        run: yarn verify

  integration-tests:
    runs-on: ubuntu-latest
    needs: verify
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: ha_ai
          POSTGRES_USER: ha_ai
          POSTGRES_PASSWORD: ha_ai_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ha_ai -d ha_ai"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 8
    env:
      TEST_DATABASE_URL: postgresql://ha_ai:ha_ai_dev_password@localhost:5432/ha_ai
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Enable Corepack
        run: |
          corepack enable
          corepack install

      - name: Install dependencies
        run: yarn install --immutable

      - name: Wait for Postgres
        run: |
          for i in {1..30}; do
            if bash -c "</dev/tcp/127.0.0.1/5432" 2>/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "Postgres did not become available in time" >&2
          exit 1

      - name: Run tests with integration enabled
        run: yarn test

  publish-pr-image:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    needs: integration-tests
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive PR image tags
        id: tags
        run: |
          short_sha="$(printf '%s' "${GITHUB_SHA}" | cut -c1-12)"
          echo "full=ghcr.io/${GITHUB_REPOSITORY}:pr-${PR_NUMBER}-sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "short=ghcr.io/${GITHUB_REPOSITORY}:pr-${PR_NUMBER}-sha-${short_sha}" >> "$GITHUB_OUTPUT"
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}

      - name: Build and push PR image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./collector/Dockerfile
          push: true
          tags: |
            ${{ steps.tags.outputs.full }}
            ${{ steps.tags.outputs.short }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=ha_ai_analyzer
            org.opencontainers.image.description=PR preview image for ha_ai_analyzer

      - name: Publish summary
        run: |
          {
            echo "## PR Image Published"
            echo
            echo "- PR: #${{ github.event.pull_request.number }}"
            echo "- Image: \`${{ steps.tags.outputs.short }}\`"
            echo "- Digest: \`${{ steps.build.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
